<div class="login-page">

  <div class="login-container">

    <div class="title-box">
      <h2>Bienvenue sur l’Espace RH</h2>
    </div>

    <div class="login-box">
      <div class="logo">
        <img src="images.png" alt="Logo" class="logo" />
      </div>

      <p class="subtitle">Connectez-vous pour accéder à votre tableau de bord</p>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <input type="email" name="email" [(ngModel)]="email" placeholder="Adresse email" required />
        </div>

        <div class="form-group">
          <input type="password" name="password" [(ngModel)]="password" placeholder="Mot de passe" required />
        </div>

        <button type="submit" [disabled]="!loginForm.valid">Se connecter</button>

        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </form>
    </div>

  </div>

</div>
